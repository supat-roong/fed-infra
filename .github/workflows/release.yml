name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install bats, shellcheck and envsubst
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck gettext-base
      # A tag consumers pin their submodule to must be green.
      - run: make ci
      - run: make contracts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
