name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install bats and envsubst
        # shellcheck is preinstalled on ubuntu-latest (confirmed in
        # actions/runner-images: images/ubuntu/toolsets/toolset-2404.json
        # lists it in apt.cmd_packages, baked in at image-build time), so it
        # is not installed here. bats and gettext-base (envsubst) are not in
        # that toolset, so they still need installing.
        #
        # apt-get update hits an Ubuntu mirror and has been observed to hang
        # and blow the job timeout on an otherwise-unchanged run. A bare
        # retry loop only reacts to a nonzero exit, not a hang, so each
        # attempt is itself wrapped in `timeout` to turn a hang into a
        # failure the retry can act on, then retried a few times before
        # giving up.
        run: |
          for i in 1 2 3; do
            sudo timeout 60 apt-get update && break
            echo "apt-get update failed (attempt $i/3), retrying..." >&2
            sleep 10
          done
          sudo apt-get install -y bats gettext-base
      # A tag consumers pin their submodule to must be green.
      - run: make ci
      - run: make contracts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
