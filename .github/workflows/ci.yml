name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install bats and envsubst
        # shellcheck is preinstalled on ubuntu-latest (confirmed in
        # actions/runner-images: images/ubuntu/toolsets/toolset-2404.json
        # lists it in apt.cmd_packages, baked in at image-build time), so it
        # is not installed here -- one less apt package, one less thing that
        # can flake. bats and gettext-base (envsubst) are not in that
        # toolset, so they still need installing.
        #
        # apt-get update hits an Ubuntu mirror and has been observed to hang
        # and blow the job timeout on an otherwise-unchanged run. A bare
        # retry loop only reacts to a nonzero exit, not a hang, so each
        # attempt is itself wrapped in `timeout` to turn a hang into a
        # failure the retry can act on, then retried a few times before
        # giving up.
        run: |
          for i in 1 2 3; do
            sudo timeout 60 apt-get update && break
            echo "apt-get update failed (attempt $i/3), retrying..." >&2
            sleep 10
          done
          sudo apt-get install -y bats gettext-base
      - run: make ci

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install envsubst
        # gettext-base is not preinstalled on ubuntu-latest (not present in
        # actions/runner-images' toolset-2404.json apt package lists), so it
        # still needs installing here. apt-get update hits an Ubuntu mirror
        # and has been observed to hang and blow the job timeout on an
        # otherwise-unchanged run. A bare retry loop only reacts to a
        # nonzero exit, not a hang, so each attempt is itself wrapped in
        # `timeout` to turn a hang into a failure the retry can act on,
        # then retried a few times before giving up.
        run: |
          for i in 1 2 3; do
            sudo timeout 60 apt-get update && break
            echo "apt-get update failed (attempt $i/3), retrying..." >&2
            sleep 10
          done
          sudo apt-get install -y gettext-base
      - name: Dry-run every fixture contract
        run: make contracts

  smoke:
    # Nightly only -- brings up a real kind cluster, far too slow for PRs.
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Report available disk
        # Measured on a real run of this job: 145G total, 58G used, 87G free
        # (40% used) before this job does anything -- roughly an order of
        # magnitude more than the ~14G the design doc guessed, and far more
        # than a single-cluster kind stack needs. No reclamation step is
        # needed on this runner image. Kept as a plain measurement (costs
        # nothing) so a future runner-image change that shrinks this shows up
        # here rather than as a mystery kind/helm failure further down.
        run: df -h /
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Install envsubst
        # gettext-base is not preinstalled on ubuntu-latest (not present in
        # actions/runner-images' toolset-2404.json apt package lists), so it
        # still needs installing here. apt-get update hits an Ubuntu mirror
        # and has been observed to hang and blow the job timeout on an
        # otherwise-unchanged run. A bare retry loop only reacts to a
        # nonzero exit, not a hang, so each attempt is itself wrapped in
        # `timeout` to turn a hang into a failure the retry can act on,
        # then retried a few times before giving up.
        run: |
          for i in 1 2 3; do
            sudo timeout 60 apt-get update && break
            echo "apt-get update failed (attempt $i/3), retrying..." >&2
            sleep 10
          done
          sudo apt-get install -y gettext-base
      - name: Bring up the single profile
        run: bin/fed-infra-up --env tests/fixtures/consumer-a.env
      - name: Verify core workloads are running
        run: |
          kubectl get pods -n consumer-a
          kubectl wait --for=condition=available deployment/mlflow-server \
            -n consumer-a --timeout=300s
      - name: Verify the run is idempotent
        # fed-infra-up must be safely re-runnable; this is not decorative.
        # A helm field-manager conflict made it non-idempotent during P3 and
        # only a re-run exposed it.
        run: bin/fed-infra-up --env tests/fixtures/consumer-a.env
      - name: Report disk after
        if: always()
        run: df -h /
      - name: Tear down
        if: always()
        run: bin/fed-infra-down --env tests/fixtures/consumer-a.env

  juju-e2e:
    # Nightly only, like smoke -- brings up the juju deploy mode against a
    # real kind cluster. ubuntu-latest is natively amd64, which is exactly
    # what the charm stack requires (see the 2026-08-28 spike findings: every
    # charm is amd64-only, and the local arm64 laptop can only emulate).
    # This job is the standing answer to the e2e items the emulated x86_64
    # run could not close: mlflow end-to-end, live namespace registration,
    # fresh-deploy config ordering, NodePort durability, temporal-ui's port.
    # A push whose head commit message contains [juju-e2e] also runs it --
    # an opt-in escape hatch for exercising this job without API access to
    # workflow_dispatch (ordinary pushes stay fast).
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && contains(github.event.head_commit.message, '[juju-e2e]'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # contents: write solely for the failure-only diagnostics ref push
      # (refs/ci-diag/*); every other job keeps the workflow-level read.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Report available disk
        # Same measurement rationale as smoke: costs nothing, and a
        # runner-image change that shrinks free disk shows up here rather
        # than as a mystery pull failure further down.
        run: df -h /
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Install envsubst
        # Same apt hang-vs-retry reasoning as the other jobs in this file.
        run: |
          for i in 1 2 3; do
            sudo timeout 60 apt-get update && break
            echo "apt-get update failed (attempt $i/3), retrying..." >&2
            sleep 10
          done
          sudo apt-get install -y gettext-base
      - name: Install juju 3.6
        # Pinned tarball, not a package manager: the charms assert
        # `juju < 4.0.0` and juju 4 dropped pod-spec support, so a floating
        # install that drifts to 4.x would break every deploy (spike
        # findings, section 1). fed_juju_require re-checks this at runtime.
        # Extract to a scratch dir and install the binary from there rather
        # than asking GNU tar for a named member: the archive's member may
        # be `./juju` rather than `juju`, and a member-name miss fails the
        # extraction outright.
        run: |
          curl -fsSL -o /tmp/juju.tar.xz \
            https://github.com/juju/juju/releases/download/v3.6.27/juju-3.6.27-linux-amd64.tar.xz
          scratch=$(mktemp -d)
          tar -xJf /tmp/juju.tar.xz -C "$scratch"
          found=$(find "$scratch" -type f -name juju | head -1)
          test -n "$found" || { echo "juju binary not found in tarball" >&2; find "$scratch" >&2; exit 1; }
          sudo install -m 0755 "$found" /usr/local/bin/juju
          juju version
      - name: Write the e2e env
        # No FED_DEPLOY_MODE on purpose: the runner's Docker daemon is
        # amd64, so this proves the `auto` resolution path end to end.
        run: |
          cat > "$RUNNER_TEMP/e2e.env" <<'EOF'
          FED_CLUSTER_NAME=fed-e2e
          FED_NAMESPACE=fed-e2e
          FED_PROFILE=single
          FED_COMPONENTS=training,temporal,minio,mlflow
          FED_S3_ENDPOINT=minio.fed-e2e.svc.cluster.local:9000
          FED_S3_ACCESS_KEY=minioadmin
          FED_S3_SECRET_KEY=minioadmin123
          FED_S3_BUCKET=mlflow-artifacts
          FED_POD_READY_ATTEMPTS=60
          EOF
      - name: Bring up the juju deploy mode
        # shell: bash gives -o pipefail, so tee cannot mask a bring-up
        # failure; the log feeds the diagnostics ref below.
        shell: bash
        run: bin/fed-infra-up --env "$RUNNER_TEMP/e2e.env" 2>&1 | tee "$RUNNER_TEMP/e2e-up.log"
      - name: Verify the deployed stack
        run: |
          juju status -m fed-fed-e2e:fed-e2e
          juju status -m fed-fed-e2e:kubeflow
          for app in minio mlflow-mysql mlflow-server temporal-k8s temporal-admin-k8s temporal-ui-k8s temporal-postgresql; do
            juju status -m fed-fed-e2e:fed-e2e "$app" --format=oneline | grep -q 'workload:active' \
              || { echo "FAIL: $app not active" >&2; exit 1; }
          done
          juju status -m fed-fed-e2e:kubeflow training-operator --format=oneline | grep -q 'workload:active'
          kubectl get crd pytorchjobs.kubeflow.org
          # Hostports come from the kind extraPortMappings the env above
          # left at their defaults (5050/8233/9001).
          curl -fsS -o /dev/null http://localhost:5050
          curl -fsS -o /dev/null http://localhost:8233
          curl -fsS -o /dev/null http://localhost:9001
          # Evidence for the spike findings' open items: real Service ports,
          # and whether the default Temporal namespace registered. Informative
          # only -- failures above are what gate the job.
          kubectl get svc -n fed-e2e -o wide
          juju run -m fed-fed-e2e:fed-e2e temporal-admin-k8s/0 cli \
            args="operator namespace describe default" || true
      - name: Verify the run is idempotent
        # Same non-decorative rationale as smoke: re-runnability regressions
        # only ever surface on a second run against live state.
        run: bin/fed-infra-up --env "$RUNNER_TEMP/e2e.env"
      - name: Diagnostics
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/diag"
          cp "$RUNNER_TEMP/e2e-up.log" "$RUNNER_TEMP/diag/" 2>/dev/null || true
          {
            juju status -m fed-fed-e2e:fed-e2e --format=yaml || true
            juju status -m fed-fed-e2e:kubeflow --format=yaml || true
            kubectl get pods -A -o wide || true
            kubectl get events -A --sort-by=.lastTimestamp | tail -80 || true
            kubectl describe pods -n fed-e2e | tail -200 || true
            juju debug-log -m fed-fed-e2e:fed-e2e --replay --limit 400 2>/dev/null | tail -300 || true
            juju debug-log -m fed-fed-e2e:kubeflow --replay --limit 200 2>/dev/null | tail -150 || true
          } > "$RUNNER_TEMP/diag/diag.txt" 2>&1
          tail -100 "$RUNNER_TEMP/diag/diag.txt"
      - name: Publish diagnostics ref
        # Job logs need API auth to read; a git ref on a public repo does
        # not. On failure, push the bring-up log + diagnostics to
        # refs/ci-diag/<run_id> (outside refs/heads, so it never shows up
        # as a branch): `git fetch origin refs/ci-diag/<run_id>` retrieves
        # it unauthenticated.
        if: failure()
        run: |
          cd "$RUNNER_TEMP/diag"
          git init -q .
          git add -A
          git -c user.email=ci@local -c user.name=ci commit -qm "juju-e2e diagnostics for run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" \
            HEAD:refs/ci-diag/${{ github.run_id }}
      - name: Report disk after
        if: always()
        run: df -h /
      - name: Tear down
        if: always()
        run: bin/fed-infra-down --env "$RUNNER_TEMP/e2e.env"
      - name: Verify teardown hygiene
        if: always()
        # `if grep; then fail` rather than `grep && fail`: under the
        # runner's `bash -e`, a no-match grep would otherwise fail the
        # step on its own exit status -- the same set -e trap lib/minio.sh
        # documents for `[ test ] && return`.
        run: |
          if kind get clusters 2>&1 | grep -q fed-e2e; then
            echo "FAIL: kind cluster survived teardown" >&2; exit 1
          fi
          if juju controllers 2>&1 | grep -q fed-fed-e2e; then
            echo "FAIL: controller record survived teardown" >&2; exit 1
          fi
          if juju clouds --client 2>&1 | grep -q fed-fed-e2e-k8s; then
            echo "FAIL: cloud record survived teardown" >&2; exit 1
          fi
          echo "teardown hygiene verified"

  consumer-contracts-guard:
    # The job below degrades to a skip, not a failure, when
    # CONSUMER_CONTRACT_REPOS is unset -- deliberately, so a fork or a fresh
    # clone that has never configured the variable doesn't fail on an
    # org-specific setting it can't have (see README.md). But on the origin
    # repo, on the runs where the check is actually expected to execute, an
    # accidentally-cleared variable would silently stop verifying anything
    # while CI stays green -- the same silent-skip-to-green shape the job
    # below exists to avoid one level further in. This job makes exactly
    # that misconfiguration loud instead, without ever naming a consumer.
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if the cross-repo contract check has nothing configured
        run: |
          if [ -z "${{ vars.CONSUMER_CONTRACT_REPOS }}" ]; then
            echo "::error::CONSUMER_CONTRACT_REPOS is unset on the origin repo, so the consumer-contracts job below will silently skip instead of verifying anything. Set the repository variable (see README.md) or this check has quietly gone dark." >&2
            exit 1
          fi
          echo "CONSUMER_CONTRACT_REPOS is set; consumer-contracts will run for real."

  consumer-contracts:
    # Nightly only. Fetches each configured consumer's real contract and
    # renders it against this repo's current main, so a library change that
    # breaks a consumer fails here rather than surfacing days later as a
    # mysterious submodule-bump failure in that consumer's own repo.
    #
    # Contracts are fetched at runtime, never committed: this repo must not
    # contain consumer identifiers anywhere in its tree (tests/agnostic.bats
    # scans the whole repo, this workflow file included), and a checked-in
    # copy would drift from the real one -- which is the exact failure this
    # job exists to catch. For the same reason, the consumer list itself
    # does not live in this matrix: it is read from the CONSUMER_CONTRACT_REPOS
    # repository variable (see README.md) so this file never needs to name a
    # consumer. If that variable is unset, this job is skipped rather than
    # failing -- forks and fresh clones aren't expected to have it set. The
    # consumer-contracts-guard job above is what keeps that skip from being
    # silent on the origin repo.
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.CONSUMER_CONTRACT_REPOS != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Guarded with `|| '[]'` in addition to the job-level `if:` above: an
      # empty/unset variable must degrade to zero matrix entries, never to a
      # fromJSON parse error, which would otherwise surface as a confusing
      # red workflow run instead of a plainly skipped job.
      matrix:
        consumer: ${{ fromJSON(vars.CONSUMER_CONTRACT_REPOS || '[]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install envsubst
        # gettext-base is not preinstalled on ubuntu-latest (not present in
        # actions/runner-images' toolset-2404.json apt package lists), so it
        # still needs installing here. apt-get update hits an Ubuntu mirror
        # and has been observed to hang and blow the job timeout on an
        # otherwise-unchanged run. A bare retry loop only reacts to a
        # nonzero exit, not a hang, so each attempt is itself wrapped in
        # `timeout` to turn a hang into a failure the retry can act on,
        # then retried a few times before giving up.
        run: |
          for i in 1 2 3; do
            sudo timeout 60 apt-get update && break
            echo "apt-get update failed (attempt $i/3), retrying..." >&2
            sleep 10
          done
          sudo apt-get install -y gettext-base
      - name: Fetch the consumer's contracts
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse \
            "https://github.com/${{ matrix.consumer.repo }}.git" /tmp/consumer
          cd /tmp/consumer && git sparse-checkout set --no-cone '/*.env*'
          ls -la /tmp/consumer
      - name: Render each contract against this fed-infra
        run: |
          set -euo pipefail
          # A consumer having only one of the listed envs is fine (per-file
          # skip below); a consumer having NONE of them is not -- that is a
          # silent-skip-to-green false pass (e.g. the sparse-checkout pattern
          # stopped matching because the consumer moved its env files), so
          # rendered_count is asserted >= 1 after the loop, not "all rendered".
          rendered_count=0
          for env in ${{ matrix.consumer.envs }}; do
            src="/tmp/consumer/$env"
            if [ ! -f "$src" ]; then
              echo "consumer has no $env; skipping"
              continue
            fi
            echo "=== $env ==="
            out=$(mktemp -d)
            bin/fed-infra-up --env "$src" --dry-run --render-dir "$out"
            test -n "$(ls -A "$out")" || { echo "FAIL: $env rendered nothing"; exit 1; }
            rendered_count=$((rendered_count + 1))
          done
          if [ "$rendered_count" -eq 0 ]; then
            echo "FAIL: ${{ matrix.consumer.repo }} rendered zero contracts -- expected at least one of: ${{ matrix.consumer.envs }}" >&2
            echo "either the consumer's layout changed or the sparse-checkout pattern stopped matching; this is a silent-pass, not a real check, until fixed" >&2
            exit 1
          fi
