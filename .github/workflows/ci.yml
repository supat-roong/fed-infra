name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install bats and envsubst
        # shellcheck is preinstalled on ubuntu-latest (confirmed in
        # actions/runner-images: images/ubuntu/toolsets/toolset-2404.json
        # lists it in apt.cmd_packages, baked in at image-build time), so it
        # is not installed here -- one less apt package, one less thing that
        # can flake. bats and gettext-base (envsubst) are not in that
        # toolset, so they still need installing.
        #
        # apt-get update hits an Ubuntu mirror and has been observed to hang
        # and blow the job timeout on an otherwise-unchanged run, so retry it
        # a few times before giving up.
        run: |
          for i in 1 2 3; do
            sudo apt-get update && break
            echo "apt-get update failed (attempt $i/3), retrying..." >&2
            sleep 10
          done
          sudo apt-get install -y bats gettext-base
      - run: make ci

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install envsubst
        # gettext-base is not preinstalled on ubuntu-latest (not present in
        # actions/runner-images' toolset-2404.json apt package lists), so it
        # still needs installing here. apt-get update hits an Ubuntu mirror
        # and has been observed to hang and blow the job timeout on an
        # otherwise-unchanged run, so retry it a few times before giving up.
        run: |
          for i in 1 2 3; do
            sudo apt-get update && break
            echo "apt-get update failed (attempt $i/3), retrying..." >&2
            sleep 10
          done
          sudo apt-get install -y gettext-base
      - name: Dry-run every fixture contract
        run: make contracts

  smoke:
    # Nightly only -- brings up a real kind cluster, far too slow for PRs.
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Report available disk
        # Measured on a real run of this job: 145G total, 58G used, 87G free
        # (40% used) before this job does anything -- roughly an order of
        # magnitude more than the ~14G the design doc guessed, and far more
        # than a single-cluster kind stack needs. No reclamation step is
        # needed on this runner image. Kept as a plain measurement (costs
        # nothing) so a future runner-image change that shrinks this shows up
        # here rather than as a mystery kind/helm failure further down.
        run: df -h /
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Install envsubst
        # gettext-base is not preinstalled on ubuntu-latest (not present in
        # actions/runner-images' toolset-2404.json apt package lists), so it
        # still needs installing here. apt-get update hits an Ubuntu mirror
        # and has been observed to hang and blow the job timeout on an
        # otherwise-unchanged run, so retry it a few times before giving up.
        run: |
          for i in 1 2 3; do
            sudo apt-get update && break
            echo "apt-get update failed (attempt $i/3), retrying..." >&2
            sleep 10
          done
          sudo apt-get install -y gettext-base
      - name: Bring up the single profile
        run: bin/fed-infra-up --env tests/fixtures/consumer-a.env
      - name: Verify core workloads are running
        run: |
          kubectl get pods -n consumer-a
          kubectl wait --for=condition=available deployment/mlflow-server \
            -n consumer-a --timeout=300s
      - name: Verify the run is idempotent
        # fed-infra-up must be safely re-runnable; this is not decorative.
        # A helm field-manager conflict made it non-idempotent during P3 and
        # only a re-run exposed it.
        run: bin/fed-infra-up --env tests/fixtures/consumer-a.env
      - name: Report disk after
        if: always()
        run: df -h /
      - name: Tear down
        if: always()
        run: bin/fed-infra-down --env tests/fixtures/consumer-a.env

  consumer-contracts:
    # Nightly only. Fetches each configured consumer's real contract and
    # renders it against this repo's current main, so a library change that
    # breaks a consumer fails here rather than surfacing days later as a
    # mysterious submodule-bump failure in that consumer's own repo.
    #
    # Contracts are fetched at runtime, never committed: this repo must not
    # contain consumer identifiers anywhere in its tree (tests/agnostic.bats
    # scans the whole repo, this workflow file included), and a checked-in
    # copy would drift from the real one -- which is the exact failure this
    # job exists to catch. For the same reason, the consumer list itself
    # does not live in this matrix: it is read from the CONSUMER_CONTRACT_REPOS
    # repository variable (see README.md) so this file never needs to name a
    # consumer. If that variable is unset, the job below is skipped rather
    # than failing -- an unconfigured repo just doesn't get this check yet.
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.CONSUMER_CONTRACT_REPOS != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Guarded with `|| '[]'` in addition to the job-level `if:` above: an
      # empty/unset variable must degrade to zero matrix entries, never to a
      # fromJSON parse error, which would otherwise surface as a confusing
      # red workflow run instead of a plainly skipped job.
      matrix:
        consumer: ${{ fromJSON(vars.CONSUMER_CONTRACT_REPOS || '[]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install envsubst
        # gettext-base is not preinstalled on ubuntu-latest (not present in
        # actions/runner-images' toolset-2404.json apt package lists), so it
        # still needs installing here. apt-get update hits an Ubuntu mirror
        # and has been observed to hang and blow the job timeout on an
        # otherwise-unchanged run, so retry it a few times before giving up.
        run: |
          for i in 1 2 3; do
            sudo apt-get update && break
            echo "apt-get update failed (attempt $i/3), retrying..." >&2
            sleep 10
          done
          sudo apt-get install -y gettext-base
      - name: Fetch the consumer's contracts
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse \
            "https://github.com/${{ matrix.consumer.repo }}.git" /tmp/consumer
          cd /tmp/consumer && git sparse-checkout set --no-cone '/*.env*'
          ls -la /tmp/consumer
      - name: Render each contract against this fed-infra
        run: |
          set -euo pipefail
          # A consumer having only one of the listed envs is fine (per-file
          # skip below); a consumer having NONE of them is not -- that is a
          # silent-skip-to-green false pass (e.g. the sparse-checkout pattern
          # stopped matching because the consumer moved its env files), so
          # rendered_count is asserted >= 1 after the loop, not "all rendered".
          rendered_count=0
          for env in ${{ matrix.consumer.envs }}; do
            src="/tmp/consumer/$env"
            if [ ! -f "$src" ]; then
              echo "consumer has no $env; skipping"
              continue
            fi
            echo "=== $env ==="
            out=$(mktemp -d)
            bin/fed-infra-up --env "$src" --dry-run --render-dir "$out"
            test -n "$(ls -A "$out")" || { echo "FAIL: $env rendered nothing"; exit 1; }
            rendered_count=$((rendered_count + 1))
          done
          if [ "$rendered_count" -eq 0 ]; then
            echo "FAIL: ${{ matrix.consumer.repo }} rendered zero contracts -- expected at least one of: ${{ matrix.consumer.envs }}" >&2
            echo "either the consumer's layout changed or the sparse-checkout pattern stopped matching; this is a silent-pass, not a real check, until fixed" >&2
            exit 1
          fi
